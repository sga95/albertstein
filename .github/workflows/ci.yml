name: ci

# Controlli su ogni PR e su main. Gli stessi di `make check`, più HTML5 e gitleaks.
# Leggi CONTRIBUTING.md per capire un errore.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: progress.json, link, immagini, peso, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make check
        run: python3 tools/check.py --no-secrets
      - name: pytest
        run: |
          pip install --quiet pytest pyyaml
          python3 -m pytest -q tests engine/tests
      - name: readiness up to date
        run: |
          python3 engine/core/render.py --today "$(python3 -c 'import json;print(json.load(open("site/data/readiness.json"))["generated_at"])')"
          git diff --exit-code -- site/data/ site/readiness/index.html || { echo "::error::file generati in site/data/ o site/readiness/ non aggiornati: lancia make engine e committa"; exit 1; }

  html:
    name: HTML valido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: html5validator
        run: |
          pip install --quiet html5validator
          html5validator --root site

  lab-notes:
    name: note di lab (punteggio, non blocca)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La PR tocca site/lab/?
        id: touched
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- site/lab/ | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Punteggio
        if: steps.touched.outputs.yes == 'true'
        run: python3 tools/check.py --lab-md > lab-lint.md; cat lab-lint.md
      - name: Commento sulla PR
        if: steps.touched.outputs.yes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lab-lint -->';
            const body = marker + '\n' + fs.readFileSync('lab-lint.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  gitleaks:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
