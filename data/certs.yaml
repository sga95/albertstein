# Catalogo delle certificazioni. Le chiede Alberto dalla pagina /certs quando i prerequisiti sono verdi;
# l'esame lo paga Stefano. Stato (requested, granted, passed) in data/certs-status.json.
#
#   prereq_steps: missioni (mission:N), boss (boss:N) o passi dei binari (track:ID:N) che devono essere done
#   study_free:   dove prepararla senza spendere
#   roles:        id in data/roles.yaml a cui serve
#   kind:         cert | voucher | course (categoria: certificazione vera, voucher di piattaforma, corso a pagamento)
#   cost_eur:     stima; Stefano la rivede

certs:
  - id: ccna
    name: Cisco CCNA 200-301
    vendor: Cisco
    kind: cert
    cost_eur: 300
    prereq_steps: [mission:8, mission:13, track:hire:7]
    study_free:
      - https://www.youtube.com/playlist?list=PLhTW6Fulbw1Tqaa9cTEpAZo86TCO6xfYS
      - https://www.netacad.com/courses/ccna-introduction-networks
      - https://www.practicalnetworking.net/
    exam_url: https://www.cisco.com/site/us/en/learn/training-certifications/exams/ccna.html
    why: "La certificazione che apre i colloqui da network engineer junior in Italia."
    roles: [junior-network-engineer, noc-analyst, network-automation-junior, cloud-network-junior]

  - id: network-plus
    name: CompTIA Network+
    vendor: CompTIA
    kind: cert
    cost_eur: 370
    prereq_steps: [mission:7, mission:8]
    study_free:
      - https://www.professormesser.com/network-plus/n10-009/n10-009-video/n10-009-training-course/
    exam_url: https://www.comptia.org/certifications/network
    why: "Vendor-neutral, chiesta da NOC e supporto; utile se il CCNA è lontano."
    roles: [noc-analyst, it-support-l2, soc-l1]

  - id: security-plus
    name: CompTIA Security+
    vendor: CompTIA
    kind: cert
    cost_eur: 400
    prereq_steps: [track:shield:9, mission:4, mission:14]
    study_free:
      - https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/
      - https://tryhackme.com/path/outline/presecurity
    exam_url: https://www.comptia.org/certifications/security
    why: "La base per SOC L1 e per ogni ruolo dove la sicurezza conta davvero."
    roles: [soc-l1, sysadmin-junior]

  - id: aws-ccp
    name: AWS Certified Cloud Practitioner
    vendor: AWS
    kind: cert
    cost_eur: 100
    prereq_steps: [mission:12]
    study_free:
      - https://skillbuilder.aws/
      - https://explore.skillbuilder.aws/learn/course/external/view/elearning/134/aws-cloud-practitioner-essentials
    exam_url: https://aws.amazon.com/certification/certified-cloud-practitioner/
    why: "Missione 17, opzione AWS: il vocabolario del cloud, chiesto anche a chi fa rete."
    roles: [cloud-network-junior, sysadmin-junior]

  - id: az-900
    name: Microsoft Azure Fundamentals AZ-900
    vendor: Microsoft
    kind: cert
    cost_eur: 100
    prereq_steps: [mission:12]
    study_free:
      - https://learn.microsoft.com/training/paths/microsoft-azure-fundamentals-describe-cloud-concepts/
    exam_url: https://learn.microsoft.com/credentials/certifications/azure-fundamentals/
    why: "Missione 17, opzione Azure: stessa cosa di AWS CCP, più diffusa nelle aziende italiane con Microsoft 365."
    roles: [cloud-network-junior, it-support-l2, sysadmin-junior]

  - id: lfca
    name: Linux Foundation Certified IT Associate (LFCA) o LPIC-1
    vendor: Linux Foundation / LPI
    kind: cert
    cost_eur: 250
    prereq_steps: [mission:5, mission:11]
    study_free:
      - https://www.edx.org/learn/linux/the-linux-foundation-introduction-to-linux
      - https://linuxjourney.com/
      - https://linuxcommand.org/tlcl.php
    exam_url: https://training.linuxfoundation.org/certification/certified-it-associate/
    why: "Dimostra Linux da sistemista; LPIC-1 è l'alternativa con più peso in Italia."
    roles: [sysadmin-junior, noc-analyst]

  - id: terraform-associate
    name: HashiCorp Terraform Associate
    vendor: HashiCorp
    kind: cert
    cost_eur: 70
    prereq_steps: [mission:19]
    study_free:
      - https://developer.hashicorp.com/terraform/tutorials/certification-003
    exam_url: https://www.hashicorp.com/certification/terraform-associate
    why: "Infrastructure as code, la skill che separa un junior che clicca da uno che scrive."
    roles: [cloud-network-junior, network-automation-junior]

  - id: thm-premium
    name: TryHackMe Premium (un anno) o Hack The Box Academy voucher
    vendor: TryHackMe / HTB
    kind: voucher
    cost_eur: 130
    prereq_steps: [track:shield:9]
    study_free:
      - https://tryhackme.com/path/outline/presecurity
      - https://academy.hackthebox.com/
    exam_url: https://tryhackme.com/pricing
    why: "Cert leggera; sblocca i percorsi a pagamento dopo aver finito quelli gratuiti."
    roles: [soc-l1]

  - id: udemy-course
    name: Un corso Udemy a scelta (categoria corso a pagamento)
    vendor: Udemy
    kind: course
    cost_eur: 20
    prereq_steps: [mission:3]
    study_free:
      - https://www.youtube.com/@JeremysITLab
    exam_url: https://www.udemy.com/
    why: "Quando un corso a pagamento accorcia davvero la strada (esempio, un corso CCNA con lab). Da motivare nella richiesta."
    roles: []
