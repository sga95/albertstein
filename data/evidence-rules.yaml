# Cosa prova cosa. Per ogni missione, boss e passo dei binari:
#   evidence: controlli che engine/core/scan.py sa fare sul repo
#     - file: percorso che deve esistere (relativo alla radice del repo)
#     - glob: pattern, min: N            almeno N file che corrispondono
#     - commits: percorso, min: N        almeno N commit che toccano quel percorso
#     - html_contains: pagina, text: T   la pagina contiene quel testo
#     - nav: etichetta                   voce presente nel menu (site/data/site.json)
#     - lab_notes: N                     almeno N note in site/lab/ (index e template esclusi)
#     - incidents: N                     almeno N voci in "incidents" di progress.json
#     - manual: motivo                   non verificabile dal repo: vale la parola di Alberto
#   attests: skill -> livello attestato quando l'elemento è done
# Se un elemento è done ma un controllo fallisce, il sito lo mostra "unverified". Nessun agente cambia done.

missions:
  1:
    evidence:
      - commits: site/index.html
        min: 1
    attests: {git: 1}
  2:
    evidence:
      - manual: record DNS e redirect vivono su Cloudflare, non nel repo
    attests: {dns: 2, tls: 2, http: 1}
  3:
    evidence:
      - manual: branch protection e preview sono impostazioni di GitHub e Cloudflare
    attests: {ci-cd: 2, git: 2}
  4:
    evidence:
      - file: site/_headers
    attests: {web-hardening: 2, http: 2}
  5:
