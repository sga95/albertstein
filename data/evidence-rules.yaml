    attests: {linux-cli: 2, git: 2, ssh: 2}
  6:
    evidence:
      - file: monitor/check.py
      - file: .github/workflows/uptime.yml
    attests: {python: 2, monitoring: 2, ci-cd: 2}
  7:
    evidence:
      - lab_notes: 1
    attests: {technical-writing: 2, packet-analysis: 2, switching-vlan: 1}
  8:
    evidence:
      - file: site/ccna/index.html
      - commits: site/ccna/index.html
        min: 2
    attests: {ip-addressing: 2, personal-brand: 1}
  9:
    evidence:
      - lab_notes: 2
    attests: {virtualization: 2, switching-vlan: 2, network-design: 2, linux-cli: 2}
  10:
    evidence:
      - lab_notes: 3
    attests: {containers: 2, network-design: 2}
  11:
    evidence:
      - glob: "lab/**/*.yml"
        min: 1
      - manual: il repo del lab può essere separato
    attests: {ansible: 2, linux-cli: 3, bash: 2}
  12:
    evidence:
      - lab_notes: 4
    attests: {backup: 2, technical-writing: 3}
  13:
    evidence:
      - lab_notes: 5
    attests: {routing: 3, network-design: 2, packet-analysis: 2}
  14:
    evidence:
      - lab_notes: 6
    attests: {firewall: 3, switching-vlan: 3}
  15:
    evidence:
      - manual: il repo dei backup delle configurazioni è separato
    attests: {network-automation: 3, python: 3, git: 3}
  16:
    evidence:
      - lab_notes: 7
    attests: {source-of-truth: 2, monitoring: 3}
  17:
    evidence:
      - manual: il badge della certificazione sta su Credly o LinkedIn
    attests: {cloud-fundamentals: 2}
  18:
    evidence:
      - lab_notes: 8
    attests: {cloud-networking: 2, ip-addressing: 3}
  19:
    evidence:
      - manual: il codice Terraform può stare in un repo separato
    attests: {iac: 2, git: 3}
  20:
    evidence:
      - lab_notes: 9
    attests: {zero-trust: 2, vpn: 2, dns: 3}

