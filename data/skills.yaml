# Tassonomia delle skill. Livelli 0-4 con descrizioni osservabili:
#   0 nessuna evidenza
#   1 ha fatto una volta, seguendo istruzioni
#   2 lo fa da solo su un caso semplice e lo sa spiegare
#   3 lo fa su un caso reale, con problemi, e lo documenta
#   4 lo insegna o lo automatizza per altri
# short: etichetta corta per il radar (max 15 caratteri)
# evidence: tipi di prova ammessi (commit, lab-note, post-mortem, cert, talk, reviewed-pr, file, manual).
# family: network | systems | cloud | automation | security | communication | hiring | ai

skills:
  # ---------- network ----------
  - id: ip-addressing
    name: IP addressing and subnetting
    short: Subnetting
    family: network
    levels:
      1: "Calcola una subnet con un tool"
      2: "Fa subnetting a mano e spiega maschera, gateway, broadcast"
      3: "Progetta il piano di indirizzi di un lab con più VLAN"
      4: "Rivede piani di indirizzamento altrui"
    evidence: [lab-note, commit]
  - id: switching-vlan
    name: Switching and VLANs
    short: VLANs
    family: network
    levels:
      1: "Configura una VLAN seguendo una guida"
      2: "Configura VLAN e trunk e verifica con show"
      3: "Segmenta un lab reale con VLAN e routing tra VLAN"
      4: "Diagnostica problemi di STP e trunk in tempo limitato"
    evidence: [lab-note, commit]
  - id: routing
    name: Routing, static and dynamic
    short: Routing
    family: network
    levels:
      1: "Aggiunge una rotta statica"
      2: "Spiega la tabella di routing e configura OSPF single area"
      3: "OSPF e BGP in un lab multi-router con test di guasto"
      4: "Diagnostica un guasto multi-router sotto tempo"
    evidence: [lab-note, post-mortem]
  - id: dns
    name: DNS
    short: DNS
    family: network
    levels:
      1: "Sa cos'è un record A"
      2: "Gestisce una zona reale: CNAME, proxy, TTL, flattening"
      3: "Diagnostica un problema DNS con dig e log"
      4: "Progetta DNS per più ambienti"
    evidence: [commit, lab-note, post-mortem]
  - id: tls
    name: TLS and certificates
    short: TLS
    family: network
    levels:
      1: "Riconosce un certificato valido nel browser"
      2: "Spiega catena, scadenza, HSTS e redirect HTTPS"
      3: "Gestisce certificati su un servizio reale"
      4: "Automatizza il rinnovo"
    evidence: [commit, lab-note]
  - id: http
    name: HTTP and web infrastructure
    short: HTTP
    family: network
    levels:
      1: "Legge uno status code"
      2: "Usa curl per header, redirect e cache"
      3: "Configura reverse proxy e header di sicurezza"
      4: "Diagnostica problemi HTTP in produzione"
    evidence: [commit, lab-note]
  - id: firewall
    name: Firewalls and segmentation
    short: Firewall
    family: network
    levels:
      1: "Sa cos'è una regola allow/deny"
      2: "Scrive regole con logging su un firewall di lab"
      3: "Segmenta una rete reale con NAT e regole provate"
      4: "Rivede policy di firewall altrui"
    evidence: [lab-note]
  - id: packet-analysis
    name: Packet analysis
    short: Packets
    family: network
    levels:
      1: "Apre una cattura in Wireshark"
      2: "Segue un flusso DNS + HTTP e spiega i pacchetti"
      3: "Usa tcpdump e Wireshark per trovare un guasto"
      4: "Scrive filtri complessi e insegna ad altri"
    evidence: [lab-note, post-mortem]
  - id: network-design
    name: Network design and documentation
    short: Net design
    family: network
    levels:
      1: "Disegna una topologia semplice"
      2: "Documenta un lab con schema e piano indirizzi"
      3: "Progetta e ricostruisce un lab completo da codice"
      4: "Progetta reti per altri"
    evidence: [lab-note, commit]
  - id: vpn
    name: VPN and tunnels
    short: VPN
    family: network
    levels:
      1: "Usa una VPN"
      2: "Configura WireGuard o un tunnel tra due host"
      3: "Collega casa e cloud in modo cifrato e documentato"
      4: "Gestisce VPN per più utenti"
    evidence: [lab-note]

