# Profili di ruolo. Per ogni skill: weight (quanto pesa nel punteggio, 1-5) e min_level (livello atteso, 1-4).
# salary_range_it: RAL lorda annua indicativa in Italia per un junior, in migliaia di euro (aggiornata dall'agente market).
# english_min: livello CEFR richiesto di solito.

