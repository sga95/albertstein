name: guard progress

# Il progresso lo sblocca solo Alberto.
# Se una PR o un push tocca site/data/progress.json e l'autore non e' lui, il check fallisce.
# Code: spostare in .github/workflows/guard-progress.yml e sostituire ALBERTO-GITHUB.

on:
  pull_request:
    paths: ["site/data/progress.json"]
  push:
    branches: [main]
    paths: ["site/data/progress.json"]

env:
  ALBERTO_LOGIN: ALBERTO-GITHUB

jobs:
  only-alberto:
    runs-on: ubuntu-latest
    steps:
      - name: Check actor
        run: |
          actor="${{ github.event.pull_request.user.login || github.actor }}"
          echo "progress.json changed by: $actor"
          if [ "$actor" != "$ALBERTO_LOGIN" ]; then
            echo "::error::Only $ALBERTO_LOGIN can change site/data/progress.json"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn on unsigned commits touching progress.json
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          unsigned=$(git log --format='%H %G?' "$base..$head" -- site/data/progress.json | awk '$2 == "N" {print $1}')
          if [ -n "$unsigned" ]; then
            echo "::warning::Unsigned commits touching progress.json: $unsigned (Shield step S5)"
          fi
